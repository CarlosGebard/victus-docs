name: Sync Wiki.js

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-wikijs:
    runs-on: ubuntu-latest

    env:
      SOURCE_DIR: .
      EXPORT_DIR: /tmp/wiki-export
      WIKI_BRANCH: wiki-production
      WIKIJS_GRAPHQL_URL: ${{ secrets.WIKIJS_GRAPHQL_URL }}
      WIKIJS_API_TOKEN: ${{ secrets.WIKIJS_API_TOKEN }}
      WIKIJS_IMPORT_TARGET: ${{ secrets.WIKIJS_IMPORT_TARGET }}

    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Load local .env when present
        shell: bash
        run: |
          if [[ -f .env ]]; then
            set -a
            # shellcheck disable=SC1091
            source .env
            set +a
          fi

          WIKIJS_API_TOKEN="${WIKIJS_API_TOKEN:-${WIKI_JS_KEY:-}}"

          {
            printf 'SOURCE_DIR=%s\n' "${SOURCE_DIR:-.}"
            printf 'EXPORT_DIR=%s\n' "${EXPORT_DIR:-/tmp/wiki-export}"
            printf 'WIKI_BRANCH=%s\n' "${WIKI_BRANCH:-wiki-production}"
            printf 'WIKIJS_GRAPHQL_URL=%s\n' "${WIKIJS_GRAPHQL_URL:-}"
            printf 'WIKIJS_API_TOKEN=%s\n' "${WIKIJS_API_TOKEN:-}"
            printf 'WIKIJS_IMPORT_TARGET=%s\n' "${WIKIJS_IMPORT_TARGET:-}"
          } >> "$GITHUB_ENV"

      - name: Build Wiki.js export
        shell: bash
        run: |
          chmod +x ops/scripts/build-wikijs-export.sh
          ops/scripts/build-wikijs-export.sh "$SOURCE_DIR" "$EXPORT_DIR"

      - name: Publish clean Wiki.js branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The orphan branch avoids leaking source-only files such as workflows,
          # scripts, runtime artifacts, or prior branch history into Wiki.js.
          git switch --orphan "$WIKI_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true

          cp -a "$EXPORT_DIR"/. .

          git add -A
          if git diff --cached --quiet; then
            echo "No Wiki.js export changes to publish."
          else
            git commit -m "Build Wiki.js export"
          fi

          git push origin "$WIKI_BRANCH" --force

      - name: Trigger Wiki.js import
        shell: bash
        run: |
          : "${WIKIJS_GRAPHQL_URL:?WIKIJS_GRAPHQL_URL is required}"
          : "${WIKIJS_API_TOKEN:?WIKIJS_API_TOKEN is required}"
          : "${WIKIJS_IMPORT_TARGET:?WIKIJS_IMPORT_TARGET is required}"

          # Import runs only after the Wiki.js export was validated and pushed.
          payload=$(jq -n --arg targetKey "$WIKIJS_IMPORT_TARGET" '{
            query: "mutation ExecuteStorageAction($targetKey: String!, $handler: String!) { storage { executeAction(targetKey: $targetKey, handler: $handler) { responseResult { succeeded errorCode slug message } } } }",
            variables: {
              targetKey: $targetKey,
              handler: "importAll"
            }
          }')

          curl --fail-with-body --show-error --silent \
            --request POST "$WIKIJS_GRAPHQL_URL" \
            --header "Authorization: Bearer $WIKIJS_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" | jq -e '
            .data.storage.executeAction.responseResult
            | select(.succeeded == true)
          '
